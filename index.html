<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor Pull Test</title>
<style>
:root{--bg:#eef1ef;--card:#fff;--fg:#14201c;--mut:#5d6b66;--line:#d3dad6;--acc:#0b6e6e;--ok:#1d7a3a;--bad:#b3261e;--warn:#a35c00;--trace:#0b6e6e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--card:#17221f;--fg:#e8efec;--mut:#93a39d;--line:#2a3a35;--acc:#4fc3bd;--ok:#5fd07f;--bad:#ff7b72;--warn:#f0b04a;--trace:#4fc3bd}}
:root[data-theme="dark"]{--bg:#0e1614;--card:#17221f;--fg:#e8efec;--mut:#93a39d;--line:#2a3a35;--acc:#4fc3bd;--ok:#5fd07f;--bad:#ff7b72;--warn:#f0b04a;--trace:#4fc3bd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:12px}
h1{font-size:20px;margin:4px 0 0}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 120px}
button{font:inherit;font-weight:600;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 14px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button.stop{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
input[type=text],input[type=number]{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 10px;width:100%}
.big{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:22px;color:var(--mut);font-weight:600}
.stats{display:flex;gap:16px;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:6px;flex-wrap:wrap}
canvas{width:100%;height:220px;display:block;margin-top:10px}
#status{color:var(--mut);font-size:14px;min-height:20px}
#verdict{font-weight:800;font-size:22px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .w{grid-column:1/-1}button.sm{min-height:36px;padding:0 10px;font-size:13px}
</style>
</head>
<body>
<main>
<h1>Anchor pull test</h1>

<section>
  <h2>Gauge</h2>
  <div class="row">
    <button class="pri" id="btnConnect">Connect gauge</button>
    <button id="btnSim">Try simulator</button>
  </div>
  <label style="margin-top:10px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="chkAll"> Show all Bluetooth devices</label>
  <div id="status">Not connected.</div>
  <p class="note" id="support"></p>
</section>

<section>
  <div class="big"><span id="load">0.00</span> <small>kN</small></div>
  <div class="stats"><span>peak <b id="peak">0.00</b></span><span>hold <b id="hold">0</b>/<b id="holdNeed">30</b> s</span><span id="verdict"></span></div>
  <canvas id="cv"></canvas>
</section>

<section id="rep" hidden>
  <h2>Test report</h2>
  <div id="repInfo"></div>
  <div class="row" style="margin-top:10px"><button class="pri" id="btnShare">Share report</button><button id="btnPdf">Download PDF</button></div>
</section>

<section>
  <h2>Job details</h2>
  <div class="grid">
    <label>Project no.<input type="text" id="m_project"></label><label>Site<input type="text" id="m_site"></label>
    <label>Location<input type="text" id="m_location"></label><label>Operator<input type="text" id="m_operator"></label>
    <label>Anchor type<input type="text" id="m_type"></label><label>Substrate<input type="text" id="m_substrate"></label>
    <label class="w">Notes<input type="text" id="m_notes"></label>
  </div>
</section>

<section>
  <h2>Test</h2>
  <div class="row">
    <label>Anchor ID<input type="text" id="anchor" value="A-01" autocomplete="off"></label>
    <label>Target kN<input type="number" id="target" value="15" step="0.1" min="0.1" inputmode="decimal"></label>
    <label>Hold s<input type="number" id="holdS" value="30" step="1" min="1" inputmode="numeric"></label>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="pri" id="btnStart">Start test</button>
    <button class="stop" id="btnStop" disabled>End test</button>
  </div>
  <p class="note">Pass: load stays at or above the target, continuously, for the full hold time.</p>
</section>

<section>
  <h2>Calibration</h2>
  <div>Raw reading: <b id="raw">-</b></div>
  <div class="row" style="margin-top:10px">
    <button id="btnZero">1. Set zero (no load)</button>
  </div>
  <div class="row" style="margin-top:10px;align-items:end">
    <label>Gauge display, kN<input type="number" id="disp" value="10" step="0.1" inputmode="decimal"></label>
    <button id="btnScale">2. Set scale (hold that load)</button>
  </div>
  <div id="calStatus" class="note"></div>
</section>

<section>
  <h2>Results</h2>
  <table><thead><tr><th>Anchor</th><th>Peak kN</th><th>Hold s</th><th>Result</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  <div class="row" style="margin-top:10px"><button id="btnCopy">Copy results as CSV</button><button id="btnClear">Clear results</button></div>
</section>
</main>

<script>
(function(){
const SVC='7312f36c-a5b4-11e6-80f5-76304dec7eb7';
const CHARS=['7312f36e-a5b4-11e6-80f5-76304dec7eb7','7312f37f-a5b4-11e6-80f5-76304dec7eb7','7312f380-a5b4-11e6-80f5-76304dec7eb7'];
const STREAM=CHARS[2];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let cal=store.get('cal',{zero:0,scale:1,ok:false});
let results=store.get('results',[]);
let raws=[],trace=[],live=false,sim=null,dev=null;
let run=null; // {t0,data:[],peak,holdStart,longest,anchor,target,hold}

function status(m){$('status').textContent=m}
function calText(){ $('calStatus').textContent=cal.ok?`Calibrated. zero ${cal.zero.toFixed(1)}, scale ${cal.scale.toPrecision(5)}`:'Not calibrated. Connect, then do steps 1 and 2.'; $('calStatus').className='note '+(cal.ok?'ok':'bad'); }
function mean(){return raws.length?raws.reduce((a,b)=>a+b,0)/raws.length:null}

function onRaw(r){ raws.push(r); if(raws.length>25)raws.shift(); $('raw').textContent=r.toFixed(2); onLoad((r-cal.zero)*cal.scale); }
function onLoad(kn){
  $('load').textContent=kn.toFixed(2);
  const now=performance.now();
  if(run){
    const t=(now-run.t0)/1000; run.data.push([t,kn]);
    if(kn>run.peak)run.peak=kn;
    if(kn>=run.target){ if(run.holdStart===null)run.holdStart=t; run.longest=Math.max(run.longest,t-run.holdStart);} else run.holdStart=null;
    const cur=run.holdStart===null?0:t-run.holdStart;
    $('peak').textContent=run.peak.toFixed(2); $('hold').textContent=cur.toFixed(0);
    $('hold').className=cur>=run.hold?'ok':'';
  } else { trace.push([now/1000,kn]); if(trace.length>600)trace.shift(); }
  draw();
}

function draw(){
  const cv=$('cv'),dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const css=getComputedStyle(document.documentElement);
  const col=n=>css.getPropertyValue(n).trim();
  const target=parseFloat($('target').value)||15;
  let pts,x0;
  if(run){pts=run.data;x0=0}else{pts=trace;x0=pts.length?pts[0][0]:0;}
  const xs=pts.map(p=>p[0]-x0),ys=pts.map(p=>p[1]);
  const xmax=Math.max(30,xs.length?xs[xs.length-1]:0),ymax=Math.max(target*1.3,ys.length?Math.max(...ys)*1.1:0,5);
  const L=34,B=20,T=6,R=8,pw=w-L-R,ph=h-B-T;
  const X=x=>L+x/xmax*pw,Y=y=>T+ph-Math.max(0,y)/ymax*ph;
  c.strokeStyle=col('--line');c.fillStyle=col('--mut');c.font='11px system-ui';c.lineWidth=1;
  for(let i=0;i<=4;i++){const v=ymax*i/4,y=Y(v);c.beginPath();c.moveTo(L,y);c.lineTo(w-R,y);c.stroke();c.fillText(v.toFixed(0),2,y+4)}
  c.fillText(xmax.toFixed(0)+' s',w-R-34,h-4);
  c.setLineDash([6,4]);c.strokeStyle=col('--bad');c.beginPath();c.moveTo(L,Y(target));c.lineTo(w-R,Y(target));c.stroke();c.setLineDash([]);
  if(pts.length>1){c.strokeStyle=col('--trace');c.lineWidth=2;c.beginPath();pts.forEach((p,i)=>{const x=X(p[0]-x0),y=Y(p[1]);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}
}

// ---- Bluetooth ----
function checkSupport(){
  const pp=document.permissionsPolicy||document.featurePolicy;
  const blocked=pp&&pp.allowsFeature&&!pp.allowsFeature('bluetooth');
  const framed=window.self!==window.top;
  let m,bad=true;
  if(!('bluetooth' in navigator))m='This browser cannot use Bluetooth. Open the page in Chrome on Android, not inside another app.';
  else if(blocked||(framed&&!pp))m='This page is embedded in another page, so the browser blocks Bluetooth here. Open it from its own web address to connect.';
  else{bad=false;m='Tap Connect gauge. Chrome asks for Nearby devices permission the first time. Bluetooth must be on (and Location on Android 11 or older).'}
  $('support').textContent=m;$('support').className='note'+(bad?' bad':'');
}
checkSupport();
$('btnConnect').onclick=async()=>{
  if(!('bluetooth' in navigator)){status('Web Bluetooth is not available here. Open this page in Chrome on Android.');return}
  stopSim();
  try{
    status('Choose the gauge in the list…');
    const opts=$('chkAll').checked?{acceptAllDevices:true,optionalServices:[SVC]}:{filters:[{services:[SVC]}]};
    dev=await navigator.bluetooth.requestDevice(opts);
    dev.addEventListener('gattserverdisconnected',onLost);
    status('Connecting…');
    const srv=await dev.gatt.connect(), svc=await srv.getPrimaryService(SVC);
    for(const u of CHARS){
      const ch=await svc.getCharacteristic(u);
      if(u===STREAM)ch.addEventListener('characteristicvaluechanged',e=>{const dv=e.target.value;if(dv.byteLength>=4)onRaw(dv.getFloat32(0,true))});
      await ch.startNotifications();
    }
    live=true;status('Connected: '+(dev.name||'gauge')+'. Receiving readings.');
  }catch(e){
    const n=e.name||'';let hint='';
    if(n==='SecurityError'||/permissions policy|disallowed/i.test(e.message||''))hint=' Bluetooth is blocked because this page is embedded. Open it from its own web address.';
    else if(n==='NotAllowedError')hint=' Permission was denied. In Chrome tap the lock icon, then Permissions, and allow Nearby devices. Also check Android Settings, Apps, Chrome, Permissions.';
    else if(n==='NotFoundError')hint=' No gauge was chosen. Tick "Show all Bluetooth devices" and try again.';
    status('Could not connect: '+n+' '+(e.message||'')+hint);
  }
};
function onLost(){ live=false; status('Connection to the gauge was lost. Press Connect gauge.'); if(run)finish('INTERRUPTED') }

// ---- simulator ----
function stopSim(){ if(sim){clearInterval(sim);sim=null;$('btnSim').textContent='Try simulator'} }
$('btnSim').onclick=()=>{
  if(sim){stopSim();status('Simulator stopped.');return}
  const tgt=()=>parseFloat($('target').value)||15; let v=0,ph=0;
  $('btnSim').textContent='Stop simulator';status('Simulator running (no gauge).');
  sim=setInterval(()=>{ if(ph===0){v+=0.25;if(v>=tgt()*1.05)ph=1}else v+=(tgt()*1.05-v)*0.1+(Math.random()-.5)*0.1; onLoad(v+(Math.random()-.5)*0.08) },100);
};

// ---- calibration ----
$('btnZero').onclick=()=>{const m=mean();if(m===null){status('Connect the gauge first.');return}cal={zero:m,scale:1,ok:false};store.set('cal',cal);calText()};
$('btnScale').onclick=()=>{const m=mean();if(m===null){status('Connect the gauge first.');return}
  const span=m-cal.zero,d=parseFloat($('disp').value);
  if(!d||Math.abs(span)<1e-6){status('Hold a steady load first, and enter the gauge display.');return}
  cal.scale=d/span;cal.ok=true;store.set('cal',cal);calText()};

// ---- test ----
$('btnStart').onclick=()=>{
  if(live&&!cal.ok){status('Calibrate first (steps 1 and 2 below).');return}
  if(!live&&!sim){status('Connect the gauge, or try the simulator.');return}
  run={t0:performance.now(),data:[],peak:0,holdStart:null,longest:0,anchor:$('anchor').value.trim()||'-',target:parseFloat($('target').value)||15,hold:parseFloat($('holdS').value)||30,meta:getMeta()};
  $('holdNeed').textContent=run.hold;$('verdict').textContent='';$('peak').textContent='0.00';$('hold').textContent='0';
  $('btnStart').disabled=true;$('btnStop').disabled=false;
};
$('btnStop').onclick=()=>finish('');
function finish(force){
  if(!run)return;
  const pass=run.longest>=run.hold, res=force||(pass?'PASS':'FAIL');
  const n=run.data.length,k=Math.max(1,Math.ceil(n/600));
  const r={id:Math.random().toString(36).slice(2,10),anchor:run.anchor,target:run.target,peak:+run.peak.toFixed(2),hold:+run.longest.toFixed(1),need:run.hold,dur:n?+run.data[n-1][0].toFixed(1):0,result:res,at:new Date().toISOString(),meta:run.meta,data:run.data.filter((_,i)=>i%k===0||i===n-1).map(p=>[+p[0].toFixed(2),+p[1].toFixed(3)])};
  results.push(r);
  store.set('results',results);
  const v=$('verdict');v.textContent=res;v.className=res==='PASS'?'ok':res==='FAIL'?'bad':'warn';
  run=null;$('btnStart').disabled=false;$('btnStop').disabled=true;
  const m=$('anchor').value.match(/^(.*?)(\d+)(\D*)$/); if(m)$('anchor').value=m[1]+String(+m[2]+1).padStart(m[2].length,'0')+m[3];
  render();draw();showReport(r);
}
function render(){
  $('rows').innerHTML=results.map((r,i)=>`<tr><td>${esc(r.anchor)}</td><td>${r.peak}</td><td>${r.hold}</td><td class="${r.result==='PASS'?'ok':r.result==='FAIL'?'bad':'warn'}"><b>${r.result}</b></td><td style="white-space:nowrap"><button class="sm" data-s="${i}">Share</button> <button class="sm" data-d="${i}">PDF</button></td></tr>`).join('')||'<tr><td colspan="5" class="note">No tests yet.</td></tr>';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('btnCopy').onclick=async()=>{
  const csv=['anchor,target_kn,peak_kn,longest_hold_s,required_hold_s,result,time'].concat(results.map(r=>[r.anchor,r.target,r.peak,r.hold,r.need,r.result,r.at].join(','))).join('\n');
  try{await navigator.clipboard.writeText(csv);status('Results copied. Paste into a spreadsheet or message.')}catch(e){status('Copy was blocked by the browser.')}
};
$('btnClear').onclick=()=>{if(results.length&&confirm('Clear all saved results on this phone?')){results=[];store.set('results',results);render()}};
$('target').oninput=draw;window.addEventListener('resize',draw);

// ---- job details ----
const MF=['project','site','location','operator','type','substrate','notes'];
const savedMeta=store.get('meta',{});
MF.forEach(k=>{const e=$('m_'+k);e.value=savedMeta[k]||'';e.oninput=()=>store.set('meta',getMeta())});
function getMeta(){const m={};MF.forEach(k=>m[k]=$('m_'+k).value.trim());return m}

// ---- report (drawn on a canvas, wrapped in a PDF; works offline) ----
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function step(max,n){for(const s of [1,2,5,10,20,50,100,200,500])if(max/s<=n)return s;return 1000}
function drawReport(r){
  const W=1240,H=1754,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const F='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif',T='#111827',M='#6b7280',G='#e5e7eb',BL='#2563eb',RD='#dc2626';
  const tx=(t,x,y,sz,col,wt,al)=>{c.font=`${wt||400} ${sz}px ${F}`;c.fillStyle=col;c.textAlign=al||'left';c.textBaseline='alphabetic';c.fillText(t,x,y)};
  const fit=(t,w,sz)=>{c.font=`400 ${sz}px ${F}`;t=String(t||'-');while(c.measureText(t).width>w&&t.length>1)t=t.slice(0,-2)+'…';return t};
  c.fillStyle='#fff';c.fillRect(0,0,W,H);
  tx('Anchor Pull Test Report',100,150,50,T,700);
  tx(`Test ${r.id}  ·  ${r.at.slice(0,19).replace('T',' ')}`,100,196,24,M);
  const bc=r.result==='PASS'?'#15803d':r.result==='FAIL'?'#b91c1c':'#b45309',bw=r.result==='INTERRUPTED'?330:190;
  c.fillStyle=bc;rr(c,W-100-bw,96,bw,86,18);c.fill();tx(r.result,W-100-bw/2,154,r.result==='INTERRUPTED'?32:46,'#fff',800,'center');
  const m=r.meta||{};
  [['Project',m.project],['Site',m.site],['Location',m.location],['Operator',m.operator],['Anchor ID',r.anchor],['Anchor type',m.type],['Substrate',m.substrate]].forEach(([k,v],i)=>{
    const x=100+(i<4?0:1)*560,y=290+(i%4)*66;tx(k,x,y,22,M);tx(fit(v,340,27),x+190,y,27,T)});
  // chart
  const L=170,R=1140,TP=660,B=1300,pw=R-L,ph=B-TP,d=r.data.length?r.data:[[0,0]];
  const xmax=Math.max(10,Math.ceil(d[d.length-1][0])),ymax=Math.ceil(Math.max(r.target*1.2,r.peak*1.1,1)/step(Math.max(r.target*1.2,r.peak*1.1,1),8))*step(Math.max(r.target*1.2,r.peak*1.1,1),8);
  const X=x=>L+x/xmax*pw,Y=y=>B-Math.max(0,y)/ymax*ph,ys=step(ymax,8),xs=step(xmax,10);
  tx('Applied load over time',100,610,30,T);
  c.lineWidth=1.5;c.strokeStyle=G;
  for(let v=0;v<=ymax;v+=ys){c.beginPath();c.moveTo(L,Y(v));c.lineTo(R,Y(v));c.stroke();tx(String(v),L-12,Y(v)+7,20,M,400,'right')}
  for(let v=0;v<=xmax;v+=xs){c.beginPath();c.moveTo(X(v),TP);c.lineTo(X(v),B);c.stroke();tx(String(v),X(v),B+30,20,M,400,'center')}
  tx('Time (s)',(L+R)/2,B+68,24,T,400,'center');
  c.save();c.translate(52,(TP+B)/2);c.rotate(-Math.PI/2);tx('Load (kN)',0,0,24,T,400,'center');c.restore();
  c.setLineDash([14,9]);c.lineWidth=2.5;c.strokeStyle=RD;c.beginPath();c.moveTo(L,Y(r.target));c.lineTo(R,Y(r.target));c.stroke();c.setLineDash([]);
  tx(`target ${r.target} kN`,R-6,Y(r.target)-10,22,RD,400,'right');
  c.lineWidth=3.5;c.strokeStyle=BL;c.lineJoin='round';c.beginPath();d.forEach((p,i)=>i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1])));c.stroke();
  // summary strip
  [['Peak load',r.peak+' kN'],['Target proof load',r.target+' kN'],['Required hold',r.need+' s'],['Longest hold ≥ target',r.hold+' s'],['Duration',r.dur+' s']].forEach(([k,v],i)=>{
    tx(k,100+i*205,1470,21,M);tx(v,100+i*205,1522,36,T,700)});
  if(r.result==='INTERRUPTED')tx('Interrupted: the connection to the gauge was lost during the test.',100,1630,22,'#b45309');
  if(m.notes)tx(fit('Notes: '+m.notes,1040,22),100,1680,22,M);
  return cv;
}
function pdfFromJpeg(jpg,w,h){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,body)=>{off[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n')};
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  off[4]=len;push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream\nendobj\n');
  const ct='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';obj(5,`<< /Length ${ct.length} >>\nstream\n${ct}\nendstream`);
  let x='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${len}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function makePdf(r){
  const cv=drawReport(r),blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',0.92));
  return pdfFromJpeg(new Uint8Array(await blob.arrayBuffer()),cv.width,cv.height);
}
const fname=r=>'pulltest_'+String(r.anchor||r.id).replace(/[^\w.-]+/g,'_')+'.pdf';
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function shareReport(r){
  try{
    const pdf=await makePdf(r),file=new File([pdf],fname(r),{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Anchor pull test report',text:`Anchor ${r.anchor}: ${r.result}`});return}catch(e){if(e.name==='AbortError')return}
    }
    download(pdf,fname(r));status('Sharing is not available here, so the PDF was downloaded instead.');
  }catch(e){status('Could not create the report: '+(e.message||e))}
}
async function pdfReport(r){try{download(await makePdf(r),fname(r))}catch(e){status('Could not create the report: '+(e.message||e))}}
let lastR=null;
function showReport(r){
  lastR=r;$('rep').hidden=false;
  $('repInfo').innerHTML=`Anchor <b>${esc(r.anchor)}</b>: <b class="${r.result==='PASS'?'ok':r.result==='FAIL'?'bad':'warn'}">${r.result}</b> (peak ${r.peak} kN, held ${r.hold} of ${r.need} s)`;
  $('rep').scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('btnShare').onclick=()=>lastR&&shareReport(lastR);
$('btnPdf').onclick=()=>lastR&&pdfReport(lastR);
$('rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s!==undefined)shareReport(results[+b.dataset.s]);else if(b.dataset.d!==undefined)pdfReport(results[+b.dataset.d])};
calText();render();draw();
})();
</script>
